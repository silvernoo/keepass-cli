name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            use_cross: true
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            use_cross: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            use_cross: false
          - runner: macos-15
            target: aarch64-apple-darwin
            use_cross: false
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            use_cross: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            use_cross: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build target
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build target with cross
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          package="kpass-${version}-${{ matrix.target }}"

          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/kpass" "dist/${package}/kpass"
          cp README.md "dist/${package}/README.md"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"$').Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          $package = "kpass-$version-${{ matrix.target }}"
          $packagePath = "dist/$package"

          New-Item -ItemType Directory -Force -Path $packagePath | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/kpass.exe" "$packagePath/kpass.exe"
          Copy-Item README.md "$packagePath/README.md"
          Compress-Archive -Path $packagePath -DestinationPath "dist/$package.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
