[package]
name = "kpass"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A focused, secure CLI for KeePass KDBX databases"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env", "color", "suggestions", "wrap_help"] }
comfy-table = "8.0"
dialoguer = "0.12"
keepass = { version = "0.15.2", features = ["save_kdbx4"] }
tempfile = "3.27"
zeroize = "1.8"

[[bin]]
name = "kpass"
path = "src/main.rs"
